name: taschenwoerterbuch
description: "Umfassendes Wörterbuch für die Sprachen Deutsch und Französisch und Konjugationstabellen."
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

version: 1.0.0+1

environment:
  sdk: ^3.13.5

# Dependencies specify other packages that your package needs in order to work.
# To automatically upgrade your package dependencies to the latest versions
# consider running `flutter pub upgrade --major-versions`. Alternatively,
# dependencies can be manually updated by changing the version numbers below to
# the latest version available on pub.dev. To see which dependencies have newer
# versions available, run `flutter pub outdated`.
dependencies:
  connectivity_plus: ^7.3.2
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^3.4.3
  intl: any
  just_audio: ^0.10.6
  path: ^1.9.1
  path_provider: ^2.1.6
  sqflite: ^2.4.4+1
  unorm_dart: ^0.3.3
  volume_controller: ^3.7.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  remove_unused_localizations: ^1.1.2
  flutter_lints: ^6.0.0
  sqflite_common_ffi: ^2.4.3
  icons_launcher: ^3.1.0

# The following section is specific to Flutter packages.
flutter:
  uses-material-design: true
  generate: true
  assets:
    # Nur für Tests ohne Server: gebündelte Wörterbücher.
    - assets/dev/
  fonts:
     - family: Gochi Hand
       fonts:
         - asset: assets/fonts/gochi-hand/GochiHand-Regular.ttf

# Run the icon generator for dark and light mode png icon generation
# with `make all` in /assets/icon.
# Run `dart run icons_launcher:create` to generate the icons.
icons_launcher:
  image_path: "assets/icon/png/icon_light.png"
  platforms:
    ios:
      enable: true
      image_path: "assets/icon/png/icon_light.png"
      dark_path: "assets/icon/png/icon_dark.png"